<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2f6f4f"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9a6a00"/></marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2f6f4f"/><stop offset="100%" stop-color="#4a9a6e"/></linearGradient>
  </defs>
  <rect width="1200" height="820" fill="#faf9f4"/>

  <!-- Informationskällor -->
  <text x="600" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#555">INFORMATIONSKÄLLOR</text>
  <rect x="90" y="45" width="180" height="40" rx="8" fill="#fff" stroke="#e4e1d6" stroke-width="1.5"/>
  <text x="180" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#262822">Journal</text>
  <line x1="180" y1="85" x2="180" y2="128" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="120" y="132" width="120" height="34" rx="6" fill="#f1efe6" stroke="#e4e1d6"/>
  <text x="180" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#555">Text</text>
  <line x1="180" y1="166" x2="180" y2="196" stroke="#555" stroke-width="1"/>
  <rect x="300" y="45" width="180" height="40" rx="8" fill="#fff" stroke="#e4e1d6" stroke-width="1.5"/>
  <text x="390" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#262822">Labprover</text>
  <line x1="390" y1="85" x2="390" y2="128" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="330" y="132" width="120" height="34" rx="6" fill="#f1efe6" stroke="#e4e1d6"/>
  <text x="390" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#555">Tabeller</text>
  <line x1="390" y1="166" x2="390" y2="196" stroke="#555" stroke-width="1"/>
  <rect x="510" y="45" width="180" height="40" rx="8" fill="#fff" stroke="#e4e1d6" stroke-width="1.5"/>
  <text x="600" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#262822">Röntgen / Bild</text>
  <line x1="600" y1="85" x2="600" y2="128" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="540" y="132" width="120" height="34" rx="6" fill="#f1efe6" stroke="#e4e1d6"/>
  <text x="600" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#555">Text</text>
  <line x1="600" y1="166" x2="600" y2="196" stroke="#555" stroke-width="1"/>
  <rect x="720" y="45" width="180" height="40" rx="8" fill="#fff" stroke="#e4e1d6" stroke-width="1.5"/>
  <text x="810" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#262822">Patientmetadata</text>
  <line x1="810" y1="85" x2="810" y2="128" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="750" y="132" width="120" height="34" rx="6" fill="#f1efe6" stroke="#e4e1d6"/>
  <text x="810" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#555">Text</text>
  <line x1="810" y1="166" x2="810" y2="196" stroke="#555" stroke-width="1"/>
  <rect x="930" y="45" width="180" height="40" rx="8" fill="#fff" stroke="#e4e1d6" stroke-width="1.5"/>
  <text x="1020" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#262822">Läkemedel</text>
  <line x1="1020" y1="85" x2="1020" y2="128" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="960" y="132" width="120" height="34" rx="6" fill="#f1efe6" stroke="#e4e1d6"/>
  <text x="1020" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#555">Tabeller</text>
  <line x1="1020" y1="166" x2="1020" y2="196" stroke="#555" stroke-width="1"/>
  <text x="22" y="153" font-size="9" font-weight="700" fill="#8c8a7c">BEARBETAS SOM</text>
  <line x1="180" y1="196" x2="1020" y2="196" stroke="#555" stroke-width="1.2"/>
  <line x1="600" y1="196" x2="600" y2="238" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- JEV + LLM, alltid tillsammans -->
  <rect x="230" y="242" width="740" height="150" rx="14" fill="#f3f8f4" stroke="#2f6f4f" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="600" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#2f6f4f">JEV + LLM — ARBETAR ALLTID TILLSAMMANS</text>

  <rect x="260" y="276" width="270" height="80" rx="12" fill="url(#headerGrad)" stroke="#2f6f4f" stroke-width="2"/>
  <text x="395" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">JEV — Mappning</text>
  <text x="395" y="326" text-anchor="middle" font-size="9.5" fill="#e7f1ea">Avgör registertillhörighet · väljer svar</text>
  <text x="395" y="341" text-anchor="middle" font-size="9.5" fill="#e7f1ea">per variabel med konfidens</text>

  <rect x="670" y="276" width="270" height="80" rx="12" fill="#fff" stroke="#9a6a00" stroke-width="2"/>
  <text x="805" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#262822">LLM — Granskning</text>
  <text x="805" y="326" text-anchor="middle" font-size="9.5" fill="#8c8a7c">Nemotron · Gemma</text>
  <text x="805" y="341" text-anchor="middle" font-size="9.5" fill="#8c8a7c">Granskar JEV:s svar mot journalen</text>

  <line x1="530" y1="303" x2="666" y2="303" stroke="#2f6f4f" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="600" y="296" text-anchor="middle" font-size="8.5" fill="#2f6f4f">svar + konfidens</text>
  <line x1="670" y1="331" x2="534" y2="331" stroke="#9a6a00" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
  <text x="600" y="347" text-anchor="middle" font-size="8.5" fill="#9a6a00">bekräftar / invänder</text>

  <text x="600" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#2f6f4f">LLM granskar varje variabel — oavsett hur säker JEV är</text>

  <line x1="600" y1="392" x2="600" y2="428" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Preliminär registrering -->
  <text x="612" y="415" font-size="10" font-weight="700" fill="#8c8a7c">PRELIMINÄR REGISTRERING</text>
  <rect x="420" y="432" width="360" height="58" rx="8" fill="#fff" stroke="#e4e1d6" stroke-width="1.5"/>
  <text x="600" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#262822">RIKS-HIA</text>
  <text x="600" y="476" text-anchor="middle" font-size="9" fill="#8c8a7c">JEV:s svar + LLM:s granskning för varje variabel</text>

  <line x1="600" y1="490" x2="600" y2="526" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="420" y="530" width="360" height="52" rx="8" fill="#2f6f4f" stroke="#1e5a3a" stroke-width="1.5"/>
  <text x="600" y="552" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Databas</text>
  <text x="600" y="569" text-anchor="middle" font-size="9" fill="#e7f1ea">Registreringen flaggas "Klar för granskning"</text>

  <line x1="600" y1="582" x2="600" y2="618" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="420" y="622" width="360" height="58" rx="8" fill="#fff" stroke="#e4e1d6" stroke-width="1.5"/>
  <text x="600" y="646" text-anchor="middle" font-size="13" font-weight="700" fill="#262822">Human granskning</text>
  <text x="600" y="666" text-anchor="middle" font-size="9" fill="#8c8a7c">Oenighet JEV/LLM markeras · rättningar sparas</text>

  <line x1="600" y1="680" x2="600" y2="716" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="330" y="720" width="540" height="58" rx="8" fill="#fff" stroke="#e4e1d6" stroke-width="1.5"/>
  <text x="600" y="744" text-anchor="middle" font-size="13" font-weight="700" fill="#262822">Optimeringsloop</text>
  <text x="600" y="764" text-anchor="middle" font-size="9" fill="#8c8a7c">Efter 1000 granskade fall → optimera JEV och LLM utifrån rättningarna</text>

  <!-- Återkoppling -->
  <path d="M 330 749 L 170 749 L 170 317 L 226 317" fill="none" stroke="#8c8a7c" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="158" y="560" text-anchor="middle" font-size="9" fill="#8c8a7c" transform="rotate(-90, 158, 560)">Återkoppling</text>

  <text x="600" y="805" text-anchor="middle" font-size="9" fill="#bbb">Kvalitetsregister — Flödesschema för automatiserad mappning</text>
</svg>
