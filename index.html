<style>
  :root{
    --bg:#faf9f4; --panel:#fffefb; --border:#e4e1d6; --text:#262822; --muted:#8c8a7c;
    --accent:#2f6f4f; --accent-soft:#e7f1ea; --good:#2f6f4f; --good-soft:#e7f1ea;
    --warn:#9a6a00; --warn-soft:#fff6e0; --chip:#f1efe6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;background:var(--bg);color:var(--text);}
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:260px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:1.1rem .9rem;}
  .brand{display:flex;align-items:center;gap:.5rem;margin-bottom:.2rem;}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;}
  .brand .tag{font-size:.7rem;color:var(--muted);}
  h1.title{font-size:1.05rem;margin:.3rem 0 1rem;}
  .section-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:1rem 0 .4rem;}
  .patient-list{list-style:none;margin:0;padding:0;}
  .patient-list li+li{margin-top:.5rem;}
  .patient-item{width:100%;text-align:left;border:1px solid var(--border);background:var(--panel);padding:.65rem .7rem;border-radius:10px;cursor:pointer;font:inherit;color:inherit;}
  .patient-item.active{background:var(--accent-soft);border-color:var(--accent);}
  .patient-card .name{font-size:.88rem;font-weight:700;}
  .patient-card .meta{font-size:.74rem;color:var(--muted);margin-top:.15rem;}
  .pill{padding:.08rem .5rem;border-radius:999px;font-size:.65rem;font-weight:700;display:inline-block;margin-top:.4rem;}
  .pill.ej{background:var(--chip);color:var(--muted);}
  .pill.klar{background:var(--good-soft);color:var(--good);}

  .main{flex:1;padding:1.3rem 1.6rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto;}
  .content-grid{display:grid;grid-template-columns:1fr 1.6fr;gap:1.2rem;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.2rem;}
  .eyebrow{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 .15rem;}
  .patient-title{font-size:1.1rem;margin:0 0 .15rem;font-weight:700;}
  .patient-sub{font-size:.8rem;color:var(--muted);margin:0 0 .9rem;}

  .tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--border);margin-bottom:.9rem;}
  .tab-btn{border:none;background:none;padding:.5rem .8rem;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

  .day-block{margin-bottom:1rem;}
  .day-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;}
  .day-head .vd{background:var(--accent);color:#fff;font-size:.68rem;font-weight:700;padding:.15rem .55rem;border-radius:6px;}
  .day-head .date{font-size:.74rem;color:var(--muted);font-weight:600;}
  .note{border-left:2px solid var(--border);padding:.1rem 0 .1rem .7rem;margin-bottom:.6rem;}
  .note-head{display:flex;align-items:baseline;gap:.4rem;margin-bottom:.2rem;flex-wrap:wrap;}
  .note-head .ntype{font-weight:700;font-size:.8rem;}
  .note-head .author{font-size:.72rem;color:var(--muted);}
  .note-head .time{margin-left:auto;font-size:.7rem;color:var(--muted);}
  .note p{margin:0;font-size:.82rem;line-height:1.55;white-space:pre-wrap;}

  .lab-row{display:flex;justify-content:space-between;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--border);}
  .lab-row:last-child{border-bottom:none;}
  .lab-name{font-weight:700;font-size:.82rem;}
  .lab-sub{font-size:.7rem;color:var(--muted);}
  .lab-val{font-weight:700;font-size:.86rem;}
  .lab-val.high{color:#a33;}

  dl.pas{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.45rem 1rem;}
  dl.pas dt{font-size:.72rem;color:var(--muted);}
  dl.pas dd{margin:0;font-size:.82rem;font-weight:700;}

  .reg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;gap:.6rem;flex-wrap:wrap;}
  .reg-actions{display:flex;gap:.5rem;}
  .btn{border-radius:9px;border:1px solid var(--border);background:#fff;padding:.5rem .85rem;font-size:.8rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;font-family:inherit;}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .banner-ok{display:flex;align-items:center;gap:.5rem;background:var(--good-soft);color:var(--good);border-radius:9px;padding:.5rem .7rem;font-size:.8rem;font-weight:700;margin-bottom:.9rem;}
  .banner-err{display:flex;align-items:center;gap:.5rem;background:#fbe9e7;color:#9c3b2e;border-radius:9px;padding:.5rem .7rem;font-size:.8rem;font-weight:700;margin-bottom:.9rem;}
  .empty-hint{font-size:.82rem;color:var(--muted);line-height:1.5;padding:1.5rem 0;}

  .field-section{margin-bottom:1.3rem;}
  .field-section h3{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;margin:0 0 .5rem;color:var(--muted);font-weight:700;}
  .field-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem;border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;margin-bottom:.5rem;background:#fff;}
  .field-row .flabel-col{flex:1 1 150px;min-width:140px;}
  .field-row .flabel-col .flabel{font-weight:700;font-size:.8rem;display:block;}
  .field-row .flabel-col .fsource{font-size:.7rem;color:var(--muted);}
  .field-row .fvalue{flex:2 1 160px;min-width:140px;}
  .field-row .fvalue input, .field-row .fvalue select{width:100%;border:1px solid var(--border);border-radius:8px;padding:.45rem .55rem;font-family:inherit;font-size:.82rem;background:#fff;color:var(--text);}
  .field-row .fconf{flex:1 1 110px;min-width:100px;}
  .field-row .fconf .struct-label{font-size:.72rem;color:var(--muted);}
  .field-row .fconf .bar-track{width:100%;height:5px;background:var(--chip);border-radius:4px;overflow:hidden;margin-bottom:.3rem;}
  .field-row .fconf .bar-fill{height:100%;background:var(--accent);border-radius:4px;}
  .field-row .fconf .conf-label{font-size:.7rem;color:var(--muted);}
  .field-row .finfo{flex:0 0 18px;color:var(--muted);font-size:.9rem;cursor:help;text-align:center;}
  .field-row .fcheck{flex:0 0 18px;color:var(--good);font-size:.95rem;text-align:center;}
  .field-row.wrong{border-color:#d93025;background:#fdecea;}
  .field-row.wrong .fvalue select{border-color:#d93025;color:#9c1c12;font-weight:700;}
  .field-row.wrong .fcheck{color:#d93025;font-weight:700;}
  .field-row .facit{display:block;font-size:.72rem;color:#9c1c12;font-weight:700;margin-top:.2rem;}
  .grade-summary{display:flex;align-items:center;gap:.5rem;border-radius:9px;padding:.5rem .7rem;font-size:.8rem;font-weight:700;margin-bottom:.9rem;background:#fdecea;color:#9c1c12;}
  .grade-summary.allok{background:var(--good-soft);color:var(--good);}
  .loading-note{display:flex;align-items:center;gap:.6rem;font-size:.82rem;color:var(--muted);padding:1rem 0;}
  .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:fixed;bottom:1.2rem;right:1.2rem;background:#262822;color:#fff;padding:.6rem 1rem;border-radius:10px;font-size:.82rem;box-shadow:0 8px 20px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;max-width:420px;font-family:inherit;}
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>

const SECTION_CONTEXT = {
  "Anamnes & riskfaktorer": "Anamnes FÖRE aktuellt insjuknande — endast sjukdomar och förhållanden kända innan denna vårdepisod; fynd som upptäcks under vårdtiden räknas inte",
  "Läkemedel vid inskrivning": "Patientens stående medicinering FÖRE aktuellt insjuknande — läkemedel som gavs prehospitalt, på akuten, vid PCI eller som sattes in under vårdtiden räknas inte",
  "Vid ankomst — status & EKG": "Status och EKG VID ANKOMST till sjukhuset — första EKG och första status, inte senare EKG eller fynd under vårdtiden",
  "Reperfusion & läkemedel under vårdtiden": "UNDER VÅRDTIDEN, från ankomst till utskrivning",
  "Vänsterkammarfunktion & komplikationer": "UNDER VÅRDTIDEN, från ankomst till utskrivning",
  "Diagnos vid utskrivning": "Bedömning VID UTSKRIVNING för aktuellt vårdtillfälle",
  "Utskrivningsläkemedel": "Läkemedel som patienten har VID UTSKRIVNING",
  "Uppföljning & övrigt": "VID UTSKRIVNING och planering efter utskrivning"
};

function collectAiItems(sections){
  sections.forEach(s => s.items.forEach(i => { i.context = SECTION_CONTEXT[s.title] || s.title; }));
  return sections.flatMap(s => s.items).filter(i => i.kind === "ai");
}

// The one real "Mappa med Jev" call: sends the full source text + the field list to
// our serverless proxy, which calls Jev (OpenRouter Decisions API) server-side.
async function mapRegister(){
  const id = currentId;
  status[id] = "laddar";
  mapError[id] = null;
  graded[id] = false;
  renderPatientList();
  renderRegister();

  const spec = buildRikshiaSpec();
  const aiItems = collectAiItems(spec);

  try {
    const resp = await fetch("/api/map", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        journalText: fullSourceText(),
        fields: aiItems.map(i => ({ key: i.key, label: `${i.context}: ${i.label} (${i.varname})`, options: i.options }))
      })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `Jev-anropet misslyckades (HTTP ${resp.status}).`);

    aiItems.forEach(i => {
      const r = data.results ? data.results[i.key] : null;
      if (r && typeof r.value === "string") {
        i.value = r.value;
        i.conf = Math.max(0, Math.min(100, Math.round(Number(r.confidence) || 0)));
        i.probs = r.probabilities || null;
      } else {
        i.value = "Okänt";
        i.conf = 0;
        i.probs = null;
      }
    });

    mappedFields[id] = spec;
    status[id] = "klar";
    showToast(`Jev har mappat RIKS-HIA från journal och bilddiagnostik (${aiItems.length} AI-fält).`);
  } catch (err) {
    status[id] = "ej";
    mapError[id] = err.message;
    showToast(`Jev-mappning misslyckades: ${err.message}`);
  }

  renderPatientList();
  if (id === currentId) renderRegister();
}

function renderPatientList(){
  const ul = document.getElementById("patient-list");
  ul.innerHTML = PATIENTS.map(c => {
    const p = c.patient;
    const pill = status[c.id] === "klar" ? `<span class="pill klar">RIKS-HIA klar</span>`
      : status[c.id] === "laddar" ? `<span class="pill ej">mappar…</span>`
      : `<span class="pill ej">ej mappad</span>`;
    return `<li><button class="patient-item patient-card ${c.id === currentId ? "active" : ""}" data-id="${c.id}">
      <div class="name">${p.name}</div>
      <div class="meta">${p.pnr} · ${p.sex === "M" ? "man" : "kvinna"}, ${p.age} år</div>
      <div class="meta">${c.summary}</div>
      ${pill}
    </button></li>`;
  }).join("");
  ul.querySelectorAll(".patient-item").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.id === currentId) return;
    selectPatient(b.dataset.id);
    currentTab = "journal";
    renderAll();
  }));
}

      </div>
      <p>${n.text}</p>
    </div>`).join("");

  const lc = document.getElementById("tab-labb");
  lc.innerHTML = LABB.map(l => `
    <div class="lab-row">
      <div><div class="lab-name">${l.name}</div><div class="lab-sub">Vårddygn ${l.vd} · ${l.sub} · ${l.time}</div></div>
      <div class="lab-val ${l.high ? 'high' : ''}">${l.value}</div>
    </div>`).join("");

  const pc = document.getElementById("tab-pas");
  pc.innerHTML = `
    <dl class="pas">
      <dt>Personnummer</dt><dd>${PATIENT.pnr}</dd>
      <dt>Kön</dt><dd>${PATIENT.sex}</dd>
      <dt>Född</dt><dd>${PATIENT.birth}</dd>
      <dt>Längd</dt><dd>${PATIENT.height} cm</dd>
      <dt>Vikt</dt><dd>${PATIENT.weight} kg</dd>
      <dt>Ankomst</dt><dd>${PATIENT.arrival}</dd>
      <dt>Sjukhus</dt><dd>${PATIENT.hospital}</dd>
      <dt>Diagnoskoder</dt><dd>${PATIENT.diagCodes.join(", ")}</dd>
    </dl>`;

  ["journal","imaging","labb","pas"].forEach(t => {
    document.getElementById(`tab-${t}`).style.display = (t === currentTab) ? "block" : "none";
  });
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === currentTab));
}

function probTooltip(it){
  if (it.kind !== "ai") return "";
  if (!it.probs) return "Jev returnerade ingen sannolikhetsfördelning för detta fält.";
  const sorted = Object.entries(it.probs).sort((a, b) => b[1] - a[1]);
  const lines = sorted.map(([k, v]) => `${k}: ${Math.round(v * 100)}%`);
  return "Jevs sannolikhetsfördelning över alternativen:\n" + lines.join("\n");
}

function renderRegister(){
  const mapped = status[currentId] === "klar";
  const loading = status[currentId] === "laddar";
  const isGraded = mapped && graded[currentId];
  const facit = PATIENTS.find(p => p.id === currentId).facit;
  const card = document.getElementById("register-card");

  let html = `
    <div class="reg-head">
      <div>
        <p class="eyebrow">Registrering i</p>
        <h2 class="patient-title" style="font-size:1.05rem;">RIKS-HIA</h2>
      </div>
      <div class="reg-actions">
        <button class="btn" id="map-btn" ${loading ? "disabled" : ""}>${mapped ? "↻ Mappa om" : "✨ Mappa till RIKS-HIA"}</button>
        <button class="btn" id="grade-btn" ${mapped ? "" : "disabled"}>${isGraded ? "✕ Dölj rättning" : "✔ Rätta"}</button>
        <button class="btn primary" id="export-btn" ${mapped ? "" : "disabled"}>⬇ Exportera</button>
      </div>
    </div>`;

  if (loading) {
    html += `<div class="loading-note"><span class="spinner"></span> Jev läser journal och bilddiagnostik och mappar till RIKS-HIA…</div>`;
  } else if (mapError[currentId]) {
    html += `<div class="banner-err">⚠ ${mapError[currentId]}</div>`;
    html += `<div class="empty-hint">Klicka <strong>Mappa med Jev</strong> för att försöka igen.</div>`;
  } else if (!mapped) {
    html += `<div class="empty-hint">Klicka <strong>Mappa med Jev</strong> för att låta Jev läsa journalen (${new Set(JOURNAL.map(n => n.vd)).size} vårddygn) och bilddiagnostiken och fylla i RIKS-HIA-registreringen.</div>`;
  } else {
    if (isGraded) {
      const ai = mappedFields[currentId].flatMap(s => s.items).filter(i => i.kind === "ai");
      const wrong = ai.filter(i => i.value !== facit[i.key]).length;
      html += wrong
        ? `<div class="grade-summary">✗ Rättning mot facit: ${ai.length - wrong} av ${ai.length} AI-fält rätt — ${wrong} felmappade fält markerade i rött</div>`
        : `<div class="grade-summary allok">✓ Rättning mot facit: alla ${ai.length} AI-fält rätt</div>`;
    } else {
      html += `<div class="banner-ok">✅ Alla fält godkända – redo för export</div>`;
    }
    mappedFields[currentId].forEach(sec => {
      html += `<div class="field-section"><h3>${sec.title}</h3>`;
      sec.items.forEach(it => {
        const valueHtml = it.options
          ? `<select ${it.kind === "ai" ? `data-key="${it.key}"` : ""}>${it.options.map(o => `<option ${o === it.value ? "selected" : ""}>${o}</option>`).join("")}</select>`
          : `<input value="${it.value ?? ""}" />`;
        const confHtml = it.kind === "struct"
          ? `<span class="struct-label">strukturerad</span>`
          : `<div class="bar-track"><div class="bar-fill" style="width:${it.conf}%"></div></div><span class="conf-label">${it.conf}% säker</span>`;
        const infoHtml = it.kind === "ai" ? `<span class="finfo" title="${probTooltip(it).replace(/"/g, '&quot;')}">💬</span>` : `<span class="finfo"></span>`;
        const isWrong = isGraded && it.kind === "ai" && it.value !== facit[it.key];
        const facitHtml = isWrong ? `<span class="facit">Facit: ${facit[it.key]}</span>` : "";
        html += `<div class="field-row ${isWrong ? "wrong" : ""}">
          <div class="flabel-col"><span class="flabel">${it.label}</span><span class="fsource">${it.source} · ${it.varname}</span>${facitHtml}</div>
          <div class="fvalue">${valueHtml}</div>
          <div class="fconf">${confHtml}</div>
          ${infoHtml}
          <div class="fcheck">${isWrong ? "✗" : "✓"}</div>
        </div>`;
      });
      html += `</div>`;
    });
  }

  card.innerHTML = html;

  document.getElementById("map-btn").addEventListener("click", mapRegister);
  // A human correction in a dropdown updates the value, so a later "Rätta" grades the corrected value.
  card.querySelectorAll("select[data-key]").forEach(sel => sel.addEventListener("change", () => {
    const it = mappedFields[currentId].flatMap(s => s.items).find(i => i.key === sel.dataset.key);
    it.value = sel.value;
    if (graded[currentId]) renderRegister();
  }));
  document.getElementById("grade-btn").addEventListener("click", () => {
    graded[currentId] = !graded[currentId];
    renderRegister();
  });

  const exportBtn = document.getElementById("export-btn");
  if (exportBtn) {
    exportBtn.addEventListener("click", () => showToast("Exporterat (demo) till RIKS-HIA."));
  }
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

let currentTab = "journal";
function renderAll(){
  renderPatientList();
  renderSource();
  renderRegister();
}

document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => { currentTab = b.dataset.tab; renderSource(); }));

renderAll();
</script>
